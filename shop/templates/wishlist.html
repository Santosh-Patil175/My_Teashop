{% extends 'base.html' %}
{% block content %}

<h2>My Wishlist</h2>

<div class="grid">
{% for item in items %}
    <div class="card">
        <img src="{{ item.product.image.url }}">
        <h3>{{ item.product.name }}</h3>
        <p>₹{{ item.product.price }}</p>
        <a href="{% url 'product_detail' item.product.id %}">
            <button>View</button>
        </a>
    </div>
{% empty %}
    <p>Your wishlist is empty.</p>
{% endfor %}
</div>

{% endblock %}
