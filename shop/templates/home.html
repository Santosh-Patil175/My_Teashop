{% extends 'base.html' %}
{% block content %}

<h2>Latest Teas</h2>

<div class="grid">
{% for product in products %}
    <div class="card">
        <img src="{{ product.image.url }}">
        <h3>{{ product.name }}</h3>
        <p>₹{{ product.price }}</p>
        <a href="{% url 'product_detail' product.id %}">
            <button>View</button>
        </a>
    </div>
{% endfor %}
</div>

{% endblock %}
